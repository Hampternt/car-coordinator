[package]
name = "carsync-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stores and forwards Car Coordinator's end-to-end encrypted shared plan. See PROTOCOL.md."
publish = false

[[bin]]
name = "carsync-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tempfile = "3"
