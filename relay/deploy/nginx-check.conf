# A stand-alone nginx.conf for checking the two snippets with `nginx -t`
# without the server's certificates (relay/README.md, "Check the nginx
# snippets"). Not for the server.
events {}

http {
    include /etc/nginx/carsync/nginx-carsync-http.conf;

    server {
        listen 80;
        listen [::]:80;
        server_name portfolio.dblo.net;

        include /etc/nginx/carsync/nginx-carsync-location.conf;

        location / {
            return 404;
        }
    }
}
