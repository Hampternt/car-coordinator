# /etc/nginx/conf.d/carsync.conf — http-level directives for the relay.
#
# `limit_req_zone` and `map` are only valid in the `http` block. Ubuntu's stock
# /etc/nginx/nginx.conf includes /etc/nginx/conf.d/*.conf inside `http`, so this
# file goes there as its own file. (Equivalent: paste these lines at the top of
# /etc/nginx/sites-available/portfolio, beside the `auth` and `drinks_login`
# zones; that file is included in `http` too. Not both: a zone defined twice
# fails `nginx -t`.)

# WebSocket upgrades per client IP: each reconnect is one request, frames are
# not counted (the relay rate-limits those itself). Two PCs behind one office
# NAT reconnecting with backoff stay far below this.
limit_req_zone $binary_remote_addr zone=carsync:10m rate=30r/m;

# The long-poll fallback (PROTOCOL.md §9), for networks that block WebSockets:
# once a session is open (its `open` counts in the zone above, as an upgrade
# does), a client makes one request every 20 s while idle and up to five a
# second while editing, and two PCs can share one office address. The relay
# rate-limits the frames inside them itself; this only stops a flood.
limit_req_zone $binary_remote_addr zone=carsync_poll:10m rate=20r/s;

# `Connection: upgrade` only when the client asked to upgrade, so a plain
# GET /carsync/health goes upstream as an ordinary request. Named for the relay
# so it cannot collide with a `$connection_upgrade` defined elsewhere.
map $http_upgrade $carsync_connection {
    default upgrade;
    ''      close;
}
