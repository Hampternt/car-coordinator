# Goes inside the `listen 443` server block of /etc/nginx/sites-available/portfolio
# (server_name portfolio.dblo.net), next to the other locations. Needs
# nginx-carsync-http.conf in place first (the zone and the map).
#
# /carsync/health and /carsync/rooms/{roomId}/ws reach the relay as /health and
# /rooms/{roomId}/ws: the trailing slash on proxy_pass strips the prefix. The
# second location below does the same for the long-poll fallback's paths.
location /carsync/ {
    limit_req zone=carsync burst=20 nodelay;
    limit_req_status 429;

    # 127.0.0.1, not localhost: nginx may resolve localhost to [::1], and the
    # relay binds IPv4 only.
    proxy_pass http://127.0.0.1:3010/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # WebSocket upgrade. The browser's Origin header is passed through
    # unchanged; the relay checks it against RELAY_ORIGINS.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $carsync_connection;

    # An idle room stays open: the relay pings every 30 s, well inside this.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
}

# The long-poll fallback (PROTOCOL.md §9): the same relay over plain POSTs, for
# networks whose proxy lets no WebSocket through. Regex locations, so for these
# paths they win over `location /carsync/` above. Quoted, because nginx reads a
# bare `{` as the start of the block.
#
# `open` starts a connection, as an upgrade does, so it shares the WebSocket's
# zone and rate: the create code is no easier to guess this way.
location ~ "^/carsync(/rooms/[A-Za-z0-9_-]{22}/poll/open)$" {
    limit_req zone=carsync burst=20 nodelay;
    limit_req_status 429;

    # One frame and change; nginx's default is 1m.
    client_max_body_size 2m;

    # The path without /carsync, as the trailing slash does above.
    proxy_pass http://127.0.0.1:3010$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# The rest of a session: a request per batch of edits, and one every 20 s
# while idle, so a looser rate of its own.
location ~ "^/carsync(/rooms/[A-Za-z0-9_-]{22}/poll/(?:recv|send|close))$" {
    limit_req zone=carsync_poll burst=100 nodelay;
    limit_req_status 429;

    # One send carries at most a frame (1 MiB) and change; the relay refuses
    # over twice that itself. nginx's default is 1m.
    client_max_body_size 2m;

    proxy_pass http://127.0.0.1:3010$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # A recv is held open for up to 20 s while it waits for frames, and is
    # answered the moment one comes.
    proxy_read_timeout 60s;
    proxy_buffering off;
}
