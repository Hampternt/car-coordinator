<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The app's one promise is that nothing you type leaves this PC. Until now
       that held because no line of code made a request; this makes the browser
       enforce it, so a stray CDN link or a fetch added by mistake fails loudly
       instead of quietly shipping the fleet somewhere. Inline styles are
       allowed because the label colours are written as style attributes;
       inline script is not, which is what turns any future markup injection
       from a hole into a blank. `ipc:` and `http://ipc.localhost` are how the
       Tauri shell reaches its own print command, and reach nothing else.
       The shared plan's relay is the one address beyond them, and only a
       browser that has joined a shared plan ever connects to it: what it
       carries is locked in this browser first. ws://127.0.0.1 is a relay on
       this PC, for development and the tests. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost wss://portfolio.dblo.net ws://127.0.0.1:*; form-action 'none'; base-uri 'none'">
  <title>Car Coordinator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%231a1c1e'/><rect y='48' width='64' height='16' fill='%23ffd400'/><path d='M8 36V20h26v16zm28-10h10l8 10H36z' fill='%23ffd400'/><circle cx='18' cy='40' r='5' fill='%231a1c1e' stroke='%23ffd400' stroke-width='3'/><circle cx='44' cy='40' r='5' fill='%231a1c1e' stroke='%23ffd400' stroke-width='3'/></svg>">
  <link rel="stylesheet" href="style.css?v=0.17.0">
  <script src="theme.js?v=0.17.0"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Car Coordinator</div>
    <!-- The other half of the day. These routes are the ones Breadify prints
         picking lists for, so the two apps swap to each other from the same
         place in the bar: beside the name of the one you are in. -->
    <a class="sibling" href="breadify/" title="Turn the bread or freezer export into printed picking lists">Breadify</a>
    <nav class="tabs">
      <button data-act="tab" data-tab="plan">Day plan</button>
      <button data-act="tab" data-tab="drivers">Drivers</button>
      <button data-act="tab" data-tab="cars">Cars</button>
      <button data-act="tab" data-tab="positions">Positions</button>
      <button data-act="tab" data-tab="labels">Labels</button>
      <button data-act="tab" data-tab="data">Data</button>
      <button data-act="tab" data-tab="preview">Print preview</button>
    </nav>
    <button class="primary" data-act="print">Print / save PDF</button>
  </header>

  <!-- Plain markup, so it shows even when no script runs: a broken or
       half-updated app.js leaves an empty page, and this line is the way out.
       The app's first draw replaces it. -->
  <div id="notices"><p class="boot-line">If this page stays empty, open the <a href="recover.html">recovery page</a>.</p></div>

  <main>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-drivers" class="tab"></section>
    <section id="tab-cars" class="tab"></section>
    <section id="tab-positions" class="tab"></section>
    <section id="tab-labels" class="tab"></section>
    <section id="tab-data" class="tab"></section>
    <section id="tab-preview" class="tab">
      <p class="hint"><span id="previewInfo"></span>This is exactly what gets printed. In the print dialog pick a printer, or "Microsoft Print to PDF" for a PDF file.</p>
    </section>
  </main>

  <dialog id="shareDlg"></dialog>

  <!-- The grid a route's driver or car is picked from. Out here, not inside
       the plan, because renderPlan() rebuilds that section wholesale. -->
  <div id="picker" hidden></div>
  <!-- The rail's tag menu, for the same reason: drawn inside its row, the
       scrolling list around it cut it off. -->
  <div id="tagMenu" class="tag-menu" role="dialog" hidden></div>
  <!-- A row's right-click menu, out here for the same reason. -->
  <div id="ctxMenu" class="ctx-menu" role="menu" tabindex="-1" hidden></div>

  <div id="sheet" class="sheet"></div>

  <!-- ?v= is APP_VERSION: a new release is a new address, so no browser pairs
       a new file with a cached one. scripts/versions.mjs keeps them level. -->
  <script src="store.js?v=0.17.0"></script>
  <script src="share.js?v=0.17.0"></script>
  <script src="map.js?v=0.17.0"></script>
  <script src="updates.js?v=0.17.0"></script>
  <script src="help.js?v=0.17.0"></script>
  <script src="sync.js?v=0.17.0"></script>
  <script src="presence.js?v=0.17.0"></script>
  <script src="app.js?v=0.17.0"></script>
</body>
</html>
